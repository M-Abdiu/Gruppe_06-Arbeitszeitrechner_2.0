
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.screen{background:var(--color-background-tertiary);border-radius:var(--border-radius-lg);padding:2.5rem 1.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:420px}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:2rem;width:340px}
.logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:0.5rem}
.logo-icon{width:36px;height:36px;background:#1A5CB8;border-radius:var(--border-radius-md);display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2}
.logo-text{font-size:18px;font-weight:500;color:var(--color-text-primary)}
.subtitle{text-align:center;font-size:13px;color:var(--color-text-secondary);margin-bottom:1.75rem}
.field{margin-bottom:1rem}
.field label{display:block;font-size:12px;color:var(--color-text-secondary);margin-bottom:6px}
.field .input-mock{background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:9px 12px;font-size:14px;color:var(--color-text-primary);width:100%}
.field .input-mock.filled{color:var(--color-text-primary)}
.field .input-mock.placeholder{color:var(--color-text-tertiary)}
.btn{width:100%;background:#1A5CB8;color:#fff;border:none;border-radius:var(--border-radius-md);padding:10px;font-size:14px;font-weight:500;margin-top:0.5rem;cursor:pointer}
.demo-hint{margin-top:1rem;text-align:center;font-size:11px;color:var(--color-text-tertiary)}
.label{font-size:11px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:0.75rem;text-align:center}
</style>
<div style="padding:1rem 0">
<p class="label">Login</p>
<div class="screen">
  <div class="card">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8"/><polyline points="10,5 10,10 13,12"/></svg>
      </div>
      <span class="logo-text">Zeiterfassung</span>
    </div>
    <p class="subtitle">Bitte anmelden</p>
    <div class="field">
      <label>Benutzername</label>
      <div class="input-mock filled">berisha</div>
    </div>
    <div class="field">
      <label>Passwort</label>
      <div class="input-mock filled" style="letter-spacing:3px">••••</div>
    </div>
    <button class="btn">Anmelden</button>
    <p class="demo-hint">Demo: admin01 / 1234  ·  berisha / 1234</p>
  </div>
</div>
</div>
